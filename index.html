<!DOCTYPE html>
<html lang="ru">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
	<title>BRAINROT RUSH</title>
	<style>
	html,
	body {
		margin: 0;
		height: 100%;
		background: #1b1030;
		overflow: hidden;
		touch-action: none
	}
	
	canvas {
		position: absolute;
		inset: 0;
		margin: auto;
		touch-action: none;
		background: #2a1650
	}
	</style>
</head>

<body>
	<canvas id="c" width="720" height="1280"></canvas>
	<script>
	"use strict";
	const cv = document.getElementById('c'),
		ctx = cv.getContext('2d'),
		W = 720,
		H = 1280;
	let K = 1;

	function fit() {
		const vw = window.visualViewport ? visualViewport.width : innerWidth,
			vh = window.visualViewport ? visualViewport.height : innerHeight,
			s = Math.min(vw / W, vh / H);
		cv.style.width = W * s + 'px';
		cv.style.height = H * s + 'px';
		K = Math.min(2, Math.max(1, s * (window.devicePixelRatio || 1)));
		if(cv.width !== Math.round(W * K)) {
			cv.width = Math.round(W * K);
			cv.height = Math.round(H * K)
		}
	}
	addEventListener('resize', fit);
	addEventListener('orientationchange', () => setTimeout(fit, 200));
	window.visualViewport && visualViewport.addEventListener('resize', fit);
	fit();
	const TOUCH = ('ontouchstart' in window) || matchMedia('(pointer:coarse)').matches;
	const rnd = (a, b) => a + Math.random() * (b - a),
		ri = (a, b) => Math.floor(rnd(a, b + 1));
	/* ===== DATA ===== */
	const RAR = {
		common: {
			n: 'ОБЫЧНЫЙ',
			col: '#9aa5b1',
			m: 1
		},
		uncommon: {
			n: 'НЕОБЫЧНЫЙ',
			col: '#4cd964',
			m: 2
		},
		rare: {
			n: 'РЕДКИЙ',
			col: '#3d9bff',
			m: 4
		},
		epic: {
			n: 'ЭПИЧЕСКИЙ',
			col: '#b050ff',
			m: 8
		},
		legendary: {
			n: 'ЛЕГЕНДАРНЫЙ',
			col: '#ffb800',
			m: 20
		},
		mythic: {
			n: 'МИФИЧЕСКИЙ',
			col: '#ff3d7f',
			m: 50
		},
		secret: {
			n: 'СЕКРЕТНЫЙ',
			col: '#00f0d0',
			m: 100
		}
	};
	const LIST = [
		['potato_rhino', 'Potato Rhino', 'common'],
		['banana_frog', 'Banana Frog', 'common'],
		['pizza_cat', 'Pizza Cat', 'common'],
		['disco_duck', 'Disco Duck', 'uncommon'],
		['cheese_penguin', 'Cheese Penguin', 'uncommon'],
		['pancake_gorilla', 'Pancake Gorilla', 'uncommon'],
		['turbo_capybara', 'Turbo Capybara', 'rare'],
		['sushi_crocodile', 'Sushi Crocodile', 'rare'],
		['rocket_chicken', 'Rocket Chicken', 'rare'],
		['cactus_cow', 'Cactus Cow', 'rare'],
		['ninja_tomato', 'Ninja Tomato', 'epic'],
		['lava_hamster', 'Lava Hamster', 'epic'],
		['moon_donkey', 'Moon Donkey', 'epic'],
		['toilet_dragon', 'Toilet Dragon', 'legendary'],
		['diamond_frog', 'Diamond Frog', 'legendary'],
		['golden_potato', 'Golden Potato', 'legendary'],
		['cosmic_banana', 'Cosmic Banana', 'mythic'],
		['rainbow_unicorn', 'Rainbow Unicorn', 'mythic'],
		['void_penguin', 'Void Penguin', 'mythic'],
		['glitch_cat', 'Glitch Cat', 'secret']
	];
	// asset: null -> placeholder. Put "assets/characters/x.webp" here (or in ASSETS) to use real art.
	const CH = LIST.map((a, i) => ({
		id: a[0],
		name: a[1],
		rarity: a[2],
		value: RAR[a[2]].m,
		mergeLevel: i,
		unlockCost: RAR[a[2]].m * 50,
		asset: null
	}));
	const _lc = {};
	CH.forEach(c => {
		_lc[c.rarity] = (_lc[c.rarity] || 0) + 1;
		c.lvl = c.rarity === 'secret' ? 0 : _lc[c.rarity]
	});
	const lvT = c => RAR[c.rarity].n + (c.lvl ? ' · УР.' + c.lvl : ''),
		nmL = c => c.name + (c.lvl ? ' · УР.' + c.lvl : '');
	const ASSETS = {
		characters: {
			potato_rhino: "assets/characters/potato_rhino.webp",
			banana_frog: "assets/characters/banana_frog.webp",
			pizza_cat: "assets/characters/pizza_cat.webp",
			disco_duck: "assets/characters/disco_duck.webp",
			cheese_penguin: "assets/characters/cheese_penguin.webp",
			pancake_gorilla: "assets/characters/pancake_gorilla.webp",
			turbo_capybara: "assets/characters/turbo_capybara.webp",
			sushi_crocodile: "assets/characters/sushi_crocodile.webp",
			rocket_chicken: "assets/characters/rocket_chicken.webp",
			cactus_cow: "assets/characters/cactus_cow.webp",
			ninja_tomato: "assets/characters/ninja_tomato.webp",
			lava_hamster: "assets/characters/lava_hamster.webp",
			moon_donkey: "assets/characters/moon_donkey.webp",
			toilet_dragon: "assets/characters/toilet_dragon.webp",
			diamond_frog: "assets/characters/diamond_frog.webp",
			golden_potato: "assets/characters/golden_potato.webp",
			cosmic_banana: "assets/characters/cosmic_banana.webp",
			rainbow_unicorn: "assets/characters/rainbow_unicorn.webp",
			void_penguin: "assets/characters/void_penguin.webp",
			glitch_cat: "assets/characters/glitch_cat.webp"
		},
		backgrounds: {
			main: null,
			raid: null
		},
		ui: {}
	}; // e.g. characters:{pizza_cat:"assets/characters/pizza_cat.webp"}
	/* ===== SYSTEMS ===== */
	const AM = {
		cache: {},
		load(id, path) {
			path = path || ASSETS.characters[id] || (CH.find(c => c.id === id) || {}).asset;
			if(!path || this.cache[id]) return;
			const im = new Image();
			im.onload = () => this.cache[id] = im;
			im.onerror = () => {};
			im.src = path
		},
		loadCharacter(id) {
			this.load(id)
		},
		get(id) {
			const i = this.cache[id];
			return i && i.naturalWidth ? i : null
		}
	};
	CH.forEach(c => AM.loadCharacter(c.id));
	const SoundManager = {
		a: {},
		play(n) {
			try {
				if(!SV.set.sound) return;
				let a = this.a[n];
				if(a === undefined) {
					a = new Audio('assets/sounds/' + n + '.mp3');
					a.onerror = () => this.a[n] = null;
					this.a[n] = a
				}
				if(a) {
					a.currentTime = 0;
					const p = a.play();
					p && p.catch(() => {})
				}
			} catch(e) {}
		}
	};
	const Ads = {
		isAvailable() {
			return true
		}, showRewarded(cb) { /* TODO Yandex: ysdk.adv.showRewardedVideo */
			UI.toast('[ ДЕМО-РЕКЛАМА ] Награда получена!');
			setTimeout(() => cb && cb(true), 400)
		}, showInterstitial(cb) {
			cb && cb()
		}
	};
	const YandexSDK = {
		ysdk: null,
		init() {
			try {
				if(window.YaGames) YaGames.init().then(s => this.ysdk = s).catch(() => {})
			} catch(e) {}
		}
	};
	YandexSDK.init();
	const Leaderboard = {
		submitScore(s) {}, getScores() {
			return [
				['Мими', 9800],
				['Бобик', 7400],
				['Зед', 5200],
				['Нина', 3100],
				['Кузя', 1500]
			]
		}
	};
	const KEY = 'brainrot_rush_v1',
		DEF = () => ({
			coins: 0,
			gems: 0,
			owned: {},
			best: 0,
			stats: {
				taps: 0,
				merges: 0,
				raids: 0,
				streak: 0,
				bestStreak: 0,
				fastRaid: 0,
				maxCombo: 0,
				abU: 0,
				ups: 0,
				gp: 0,
				ab: 0,
				hell: 0,
				days: 0,
				fb: 0,
				jb: 0
			},
			set: {
				sound: true,
				fx: true
			},
			daily: {
				date: '',
				day: 0
			},
			ach: {},
			up: {},
			abl: {},
			stolen: {},
			slots: [],
			boostT: 0,
			rp: 0,
			pr: {
				n: 0,
				pts: 0,
				up: {}
			}
		});
	let SV = DEF();
	const SaveManager = {
		save() {
			try {
				SV.slots = slots.map(s => ({
					p: s.p,
					id: s.c.id
				}));
				SV.ts = Date.now();
				localStorage.setItem(KEY, JSON.stringify(SV))
			} catch(e) {}
		}, load() {
			try {
				const d = JSON.parse(localStorage.getItem(KEY));
				if(!d || typeof d.coins !== 'number') throw 0;
				const b = DEF();
				SV = Object.assign(b, d);
				SV.stats = Object.assign(b.stats, d.stats);
				SV.set = Object.assign(b.set, d.set);
				SV.daily = Object.assign(b.daily, d.daily);
				SV.owned = d.owned || {};
				SV.ach = d.ach || {};
				SV.up = d.up || {};
				SV.abl = d.abl || {};
				SV.slots = Array.isArray(d.slots) ? d.slots : [];
				SV.pr = Object.assign({
					n: 0,
					pts: 0
				}, d.pr);
				SV.pr.up = (d.pr && d.pr.up) || {};
				SV.stolen = d.stolen || Object.fromEntries(CH.filter(c => c.mergeLevel >= 7 && SV.owned[c.id]).map(c => [c.id, 1]))
			} catch(e) {
				SV = DEF()
			}
		}, reset() {
			SV = DEF();
			this.save()
		}
	};
	SaveManager.load();
	setInterval(() => SaveManager.save(), 2000);
	addEventListener('beforeunload', () => SaveManager.save());
	addEventListener('pagehide', () => SaveManager.save());
	/* ===== ACHIEVEMENTS ===== */
	const cnt = r => CH.filter(c => c.rarity === r && SV.owned[c.id]).length,
		st = k => () => SV.stats[k],
		A = (id, n, d, g, cur, r) => ({
			id, n, d, g, cur, r
		});
	const ACH = [A('first', 'ПЕРВЫЙ БРЕЙНРОТ', 'Получи первого брейнрота', 1, () => own(), ['c', 100]), A('tap500', 'ТАПАЛКА', 'Сделай 500 тапов', 500, st('taps'), ['c', 150]), A('tap5k', 'ТАП-МАСТЕР', 'Сделай 5000 тапов', 5000, st('taps'), ['g', 1]),
		A('mrg10', 'МАСТЕР СЛИЯНИЯ', 'Сделай 10 слияний', 10, st('merges'), ['c', 200]), A('mrg50', 'ФЬЮЖН-БОГ', 'Сделай 50 слияний', 50, st('merges'), ['g', 2]), A('cmb10', 'КОМБО!', 'Набери комбо x10', 10, st('maxCombo'), ['c', 150]),
		A('col10', 'КОЛЛЕКЦИОНЕР', 'Открой 10 брейнротов', 10, () => own(), ['c', 400]), A('col20', 'БОГ БРЕЙНРОТОВ', 'Открой всех 20 брейнротов', 20, () => own(), ['g', 5]),
		A('rare', 'РЕДКАЯ НАХОДКА', 'Получи Rare брейнрота', 1, () => cnt('rare'), ['c', 200]), A('epic', 'ЭПИК!', 'Получи Epic брейнрота', 1, () => cnt('epic'), ['g', 1]), A('leg', 'ЛЕГЕНДА!', 'Получи Legendary брейнрота', 1, () => cnt('legendary'), ['g', 3]),
		A('myth', 'МИФ', 'Получи Mythic брейнрота', 1, () => cnt('mythic'), ['g', 4]), A('sec', 'СЕКРЕТ', 'Получи Secret брейнрота', 1, () => cnt('secret'), ['g', 6]), A('thief', 'ВОР', 'Успешно пройди Rush', 1, st('raids'), ['c', 250]),
		A('raid10', 'МАТЁРЫЙ ВОР', 'Пройди 10 Rush', 10, st('raids'), ['g', 2]), A('unst', 'НЕУДЕРЖИМЫЙ', 'Пройди 5 Rush подряд', 5, st('bestStreak'), ['g', 2]), A('speed', 'СПИДРАННЕР', 'Победи на ПОГОНЕ+ с большим запасом', 1, st('fastRaid'), ['g', 1]),
		A('gem10', 'ОХОТНИК ЗА 💎', 'Собери 10 алмазов в Rush', 10, st('gp'), ['c', 300]), A('gem50', 'АЛМАЗНЫЙ КОРОЛЬ', 'Собери 50 алмазов в Rush', 50, st('gp'), ['g', 3]), A('abuse', 'ADMIN ABUSE!', 'Поймай ADMIN ABUSE', 1, st('ab'), ['g', 2]),
		A('hell', 'АДСКИЙ ВОР', 'Победи на АДСКОМ РАШЕ', 1, st('hell'), ['g', 4]), A('skill', 'СУПЕРСИЛА', 'Используй способности 25 раз', 25, st('abU'), ['c', 150]), A('ups', 'КАЧОК', 'Купи 5 улучшений', 5, st('ups'), ['c', 300]), A('days', 'ПОСТОЯНСТВО', 'Забери 3 ежедневные награды', 3, st('days'), ['c', 200])
	];
	const rwT = a => (a.r[0] === 'c' ? '💰' : '💎') + a.r[1];

	function claimAch(a) {
		if(SV.ach[a.id] !== 1) return;
		SV.ach[a.id] = 2;
		SV[a.r[0] === 'c' ? 'coins' : 'gems'] += a.r[1];
		SoundManager.play('success');
		UI.toast('Получено: ' + rwT(a));
		SaveManager.save()
	}
	const own = () => Object.keys(SV.owned).length,
		has = r => CH.some(c => c.rarity === r && SV.owned[c.id]);

	function checkAch() {
		for(const a of ACH)
			if(!SV.ach[a.id] && a.cur() >= a.g) {
				SV.ach[a.id] = 1;
				UI.pop.push(a);
				SoundManager.play('success')
			}
	}

	function give(c) {
		const first = !SV.owned[c.id];
		SV.owned[c.id] = 1;
		checkAch();
		return first
	}
	/* ===== UI HELPERS ===== */
	const UI = {
		rings: [],
		pop: [],
		cur: null,
		curT: 0,
		btns: [],
		floats: [],
		parts: [],
		shake: 0,
		msg: '',
		msgT: 0,
		toast(t) {
			this.msg = t;
			this.msgT = 2
		}
	};
	const PMAX = (navigator.hardwareConcurrency || 4) <= 4 ? 25 : 60;

	function rr(x, y, w, h, r) {
		ctx.beginPath();
		ctx.roundRect ? ctx.roundRect(x, y, w, h, r) : ctx.rect(x, y, w, h)
	}

	function T(t, x, y, s, col, al) {
		ctx.font = '900 ' + s + 'px system-ui,Arial';
		ctx.textAlign = al || 'center';
		ctx.textBaseline = 'middle';
		ctx.lineWidth = s / 6;
		ctx.strokeStyle = '#0008';
		ctx.strokeText(t, x, y);
		ctx.fillStyle = col || '#fff';
		ctx.fillText(t, x, y)
	}

	function B(x, y, w, h, t, col, fn, fs) {
		UI.btns.push({
			x, y, w, h, fn
		});
		ctx.fillStyle = '#0006';
		rr(x, y + 6, w, h, 22);
		ctx.fill();
		ctx.fillStyle = col || '#ff7a1a';
		rr(x, y, w, h, 22);
		ctx.fill();
		ctx.strokeStyle = '#fff8';
		ctx.lineWidth = 4;
		ctx.stroke();
		T(t, x + w / 2, y + h / 2, fs || Math.min(48, h * .5))
	}

	function bar(x, y, w, h, p, col) {
		ctx.fillStyle = '#0008';
		rr(x, y, w, h, h / 2);
		ctx.fill();
		if(p > 0) {
			ctx.fillStyle = col || '#4cd964';
			rr(x, y, Math.max(h, w * Math.min(1, p)), h, h / 2);
			ctx.fill()
		}
	}

	function float(t, x, y, col, s) {
		UI.floats.push({
			t, x, y, col, s: s || 44, l: 1
		})
	}

	function burst(x, y, col, n) {
		if(!SV.set.fx) return;
		for(let i = 0; i < n && UI.parts.length < PMAX; i++) UI.parts.push({
			x, y, vx: rnd(-300, 300), vy: rnd(-400, 100), l: .7, col
		})
	}

	function drawChar(c, x, y, s, sq) {
		const img = AM.get(c.id),
			r = RAR[c.rarity];
		ctx.save();
		ctx.translate(x, y);
		if(sq) ctx.scale(1 + sq, 1 - sq);
		if(img) ctx.drawImage(img, -s / 2, -s / 2, s, s);
		else {
			ctx.fillStyle = 'hsl(' + (c.mergeLevel * 18) + ',70%,55%)';
			rr(-s / 2, -s / 2, s, s, s * .28);
			ctx.fill();
			ctx.strokeStyle = r.col;
			ctx.lineWidth = Math.max(4, s / 14);
			ctx.stroke();
			ctx.fillStyle = '#fff';
			[-1, 1].forEach(k => {
				ctx.beginPath();
				ctx.arc(k * s * .2, -s * .12, s * .11, 0, 7);
				ctx.fill()
			});
			ctx.fillStyle = '#000';
			[-1, 1].forEach(k => {
				ctx.beginPath();
				ctx.arc(k * s * .2, -s * .12, s * .05, 0, 7);
				ctx.fill()
			});
			ctx.fillRect(-s * .15, s * .1, s * .3, s * .06);
			ctx.font = '800 ' + Math.max(11, s * .12) + 'px system-ui';
			ctx.fillStyle = '#fff';
			ctx.textAlign = 'center';
			ctx.fillText(c.name, 0, s * .32, s * .9)
		}
		ctx.restore()
	}

	function bg(a, b) {
		const g = ctx.createLinearGradient(0, 0, 0, H);
		g.addColorStop(0, a || '#3a1c78');
		g.addColorStop(1, b || '#14082c');
		ctx.fillStyle = g;
		ctx.fillRect(0, 0, W, H)
	}

	function topBar() {
		ctx.fillStyle = '#0007';
		rr(20, 16, 200, 56, 28);
		ctx.fill();
		rr(240, 16, 160, 56, 28);
		ctx.fill();
		T('💰 ' + SV.coins, 120, 45, 30, '#ffe14d');
		T('💎 ' + SV.gems, 320, 45, 30, '#7fe9ff')
	}
	/* ===== GAME STATE ===== */
	let scene = 'menu',
		slots = [],
		sel = -1,
		combo = 0,
		comboT = 0,
		spawnT = 0,
		merged = null,
		mergeT = 0,
		hint = '';
	const G = {};
	const go = s => {
		scene = s;
		if(typeof DBG !== 'undefined') {
			DBG.s = 0;
			DBG.e = 0
		}
		SoundManager.play('click');
		if(s === 'play') {
			if(!slots.length)
				for(let i = 0; i < 3; i++) spawn()
		}
	};

	function spawn(top) {
		const mx = maxS();
		if(slots.length >= mx) return;
		const used = slots.map(s => s.p);
		let p = 0;
		while(used.includes(p)) p++;
		if(p >= mx) return;
		let lvl;
		if(!SV.stats.merges) lvl = ri(0, 1);
		else {
			const f = lv('filt'),
				mn = f ? FMIN[f - 1] : 0,
				am = Math.max(6, stMax()),
				ps = [];
			for(let i = mn; i <= Math.min(mn + 3, am); i++) ps.push(i);
			if(!ps.length) ps.push(Math.min(mn, am));
			let r = Math.random() * ps.reduce((a, _, i) => a + 4 - i, 0);
			lvl = ps.find((_, i) => (r -= 4 - i) < 0);
			if(lvl === undefined) lvl = ps[0];
			if(top) lvl = ps[ps.length - 1]
		}
		slots.push({
			p, c: CH[lvl], sq: 0, bob: rnd(0, 6)
		})
	}
	const SP = [
		[150, 350],
		[360, 350],
		[570, 350],
		[150, 525],
		[360, 525],
		[570, 525],
		[150, 700],
		[360, 700],
		[570, 700],
		[150, 875],
		[360, 875],
		[570, 875]
	];

	function tapSlot(i) {
		const s = slots[i];
		SV.stats.taps++;
		comboT = 2 + .3 * lv('combo');
		combo++;
		SV.stats.maxCombo = Math.max(SV.stats.maxCombo, combo);
		const m = combo >= 15 ? 4 : combo >= 8 ? 3 : combo >= 4 ? 2 : 1,
			v = Math.round(s.c.value * m * (1 + .25 * lv('tap')) * (1 + .1 * stN()));
		SV.coins += v;
		s.sq = .3;
		if(G.an && G.an.s === s) {
			G.an = null;
			float('⚡ x3!', SP[s.p][0], SP[s.p][1] - 130, '#ffe14d', 40);
			if(Math.random() < .04) {
				SV.gems++;
				float('+1💎', SP[s.p][0], SP[s.p][1] - 170, '#7fe9ff', 36)
			}
		}
		float('+' + v, SP[s.p][0], SP[s.p][1] - 90, '#ffe14d');
		burst(SP[s.p][0], SP[s.p][1], '#ffe14d', 6);
		SoundManager.play('collect');
		if(combo >= 4 && combo % 4 === 0) float(combo >= 15 ? '🔥 БЕЗУМИЕ!' : 'КОМБО x' + m, 360, 230, '#ff7a1a', 54);
		UI.shake = Math.max(UI.shake, combo >= 15 ? 6 : 2);
	}

	function doMerge(a, b) {
		const c = slots[a].c,
			n = CH[c.mergeLevel + 1],
			bp = slots[b].p,
			pos = SP[bp];
		slots = slots.filter((_, k) => k !== a && k !== b);
		const st = {
			p: bp,
			c: n,
			sq: .5,
			bob: 0
		};
		slots.push(st);
		sel = -1;
		SV.stats.merges++;
		const first = give(n);
		SV.coins += n.value * 8;
		merged = {
			a: c,
			n,
			first
		};
		mergeT = 2.6;
		burst(pos[0], pos[1], RAR[n.rarity].col, 26);
		UI.shake = 7;
		UI.rings.push({
			x: pos[0],
			y: pos[1],
			r: 20,
			l: .5,
			col: RAR[n.rarity].col
		}, {
			x: pos[0],
			y: pos[1],
			r: 8,
			l: .35,
			col: '#fff'
		});
		float('СЛИЯНИЕ!', pos[0], pos[1] - 110, '#ffe14d', 38);
		SoundManager.play('merge');
		checkAch();
		SaveManager.save()
	}
	/* ===== RAID RUNNER ===== */
	const R = {};
	const LX = [160, 360, 560];

	function startRaid() {
		const RG = [
				[7, 9],
				[10, 12],
				[13, 15],
				[16, 19]
			][setup.map],
			nx = CH.find(c => c.mergeLevel >= RG[0] && c.mergeLevel <= RG[1] && !SV.stolen[c.id]);
		if(!setup.run || !SV.owned[setup.run.id]) setup.run = CH.find(c => SV.owned[c.id]) || CH[0];
		Object.assign(R, {
			target: nx || CH[ri(RG[0], RG[1])],
			run: setup.run,
			d: setup.d,
			D: DIFF[setup.d],
			M: MAPS[setup.map],
			mi: setup.map,
			bs: [],
			sh: rnd(5, 7),
			lane: 1,
			jy: 0,
			vy: 0,
			obs: [],
			t: 0,
			dur: DIFF[setup.d].dur,
			gap: 1,
			spawn: 1,
			over: false,
			win: false,
			inv: 0,
			shield: lv('shield'),
			gems: 0,
			coins: 0,
			claimed: 0,
			slowT: 0,
			slowF: 1,
			leap: 0,
			mag: 0,
			cd: 3,
			bonus: false,
			bt: 0,
			bsp: 0,
			bk: 3,
			px: 360,
			lt: rnd(7, 10),
			lw: 0,
			half: 0,
			pt: rnd(5, 8)
		});
		scene = 'raid';
		SoundManager.play('click');
		const a = AB[R.run.mergeLevel];
		UI.toast(a[1] + ' ' + a[0] + ' — кнопка справа / E')
	}

	function lane(d) {
		R.lane = Math.max(0, Math.min(2, R.lane + d))
	}

	function jump() {
		if(R.jy === 0) {
			R.vy = R.M.jv * (R.leap > 0 ? 1.25 : 1);
			SoundManager.play('jump')
		}
	}
	const isPK = t => t === 2 || t === 3 || t === 7,
		HI = [1, 4, 5];

	function spawnPattern() {
		const D = R.D,
			M = R.M,
			d = R.d;
		R.spawn = rnd(D.a, D.b) * M.sm;
		const o = (l, y, type, e) => R.obs.push(Object.assign({
				l, y, type, ph: rnd(0, 6), x: LX[l]
			}, e || {})),
			L = ri(0, 2);
		if(Math.random() < D.gem * M.gm) {
			o(L, -60, 2);
			return
		}
		const pk = [],
			add = (k, n) => {
				for(let i = 0; i < n; i++) pk.push(k)
			};
		add('single', M.sp ? 2 : 4);
		add('coins', M.cn);
		if(d >= 1) {
			add('gap', 2);
			add('rocket', M.rk)
		}
		if(d >= 2) {
			add('bar', M.lava ? 0 : 2);
			add('zig', 2)
		}
		if(d >= 2 || M.sp) {
			add('move', M.mv);
			add('move2', M.mv2 || 0)
		}
		if(M.aval) add('aval', M.aval);
		if(M.lava) add('lava', M.lava);
		let k = pk[ri(0, pk.length - 1)];
		const sp0 = (520 + R.t * M.acc) * D.sp * (R.half ? 1.12 : 1),
			at = (y, vm) => (1010 - y) / (sp0 * (vm || 1)),
			hz = R.obs.filter(h => !isPK(h.type) && !h.dead);
		if(k === 'rocket') {
			const ra = at(-420, [2, 1.9, 1.6, 1.4][d]);
			if(hz.some(h => Math.abs(at(h.y, h.vm) - ra) < .9)) k = 'coins'
		} else if(k !== 'coins' && k !== 'pu') {
			const na = at(-60);
			if(hz.some(h => h.type === 5 && Math.abs(at(h.y, h.vm) - na) < .9)) k = 'coins'
		}
		if(k === 'single') o(L, -60, Math.random() < M.wall ? 1 : 0);
		else if(k === 'coins') {
			for(let i = 0; i < 5; i++) o(L, -60 - i * 90, 3);
			R.spawn += .3
		} else if(k === 'pu') o(L, -60, 7, {
			k: ri(0, 2)
		});
		else if(k === 'gap') {
			[0, 1, 2].filter(l => l !== L).forEach(l => o(l, -60, 1))
		} else if(k === 'rocket') o(L, -420, 5, {
			vm: [2, 1.9, 1.6, 1.4][d]
		});
		else if(k === 'bar') o(1, -60, 6);
		else if(k === 'zig') {
			for(let i = 0; i < 3; i++) o((L + i) % 3, -60 - i * 280, 1);
			R.spawn += .9
		} else if(k === 'move') o(1, -60, 4);
		else if(k === 'move2') {
			o(1, -60, 4, {
				ph: 0
			});
			o(1, -60, 4, {
				ph: Math.PI
			});
			R.spawn += .4
		} else if(k === 'aval') o(L, -300, 9, {
			vm: 1.5
		});
		else if(k === 'lava') {
			o(L, -110, 8, {
				h: 110
			});
			if(d >= 2) o((L + 1) % 3, -110, 8, {
				h: 110
			});
			R.spawn += .3
		}
	}

	function spawnPU() {
		const D = R.D,
			M = R.M;
		R.pt = rnd(8, 12) / (.7 + .15 * M.pu) * (1 + .08 * (3 - R.d));
		const w = [R.shield > 0 ? 1 : 3, R.gap < .5 ? 4 : 2, R.mag > 0 ? 1 : 2],
			r0 = Math.random() * (w[0] + w[1] + w[2]),
			k = r0 < w[0] ? 0 : r0 < w[0] + w[1] ? 1 : 2,
			sp0 = (520 + R.t * M.acc) * D.sp * (R.half ? 1.12 : 1),
			ta = 1070 / sp0,
			hz = R.obs.filter(h => !isPK(h.type) && !h.dead),
			ls = [0, 1, 2].filter(l => !hz.some(h => (h.type === 6 || h.l === l) && Math.abs((1010 - h.y) / (sp0 * (h.vm || 1)) - ta) < .6)),
			L = ls.length ? ls[ri(0, ls.length - 1)] : ri(0, 2);
		R.obs.push({
			l: L,
			y: -60,
			type: 7,
			k,
			ph: rnd(0, 6),
			x: LX[L]
		})
	}

	function raidUpdate(dt) {
		if(R.over) return;
		if(G.god) R.inv = Math.max(R.inv, 1);
		R.t += dt;
		R.inv -= dt;
		R.spawn -= dt;
		R.slowT -= dt;
		R.leap -= dt;
		R.mag -= dt;
		R.cd -= dt;
		R.pt -= dt;
		if(R.pt <= 0 && R.t < R.dur - 4 && !R.bonus) spawnPU();
		if(!R.bonus) {
			R.sh -= dt;
			if(R.sh <= 0 && R.t > 3 && R.t < R.dur - 2) {
				R.sh = rnd(7, 10) / (1 + .22 * R.d);
				const n = R.d >= 2 && Math.random() < .5 ? 2 : 1;
				[0, 1, 2].sort(() => Math.random() - .5).slice(0, n).forEach(l => R.bs.push({
					l, t: 1.1 - .08 * R.d
				}));
				SoundManager.play('fail')
			}
			R.bs.forEach(b => {
				b.t -= dt;
				if(b.t <= 0 && !b.done) {
					b.done = 1;
					b.f = .25;
					UI.shake = Math.max(UI.shake, 6);
					if(R.inv <= 0 && Math.abs(LX[b.l] - LX[R.lane]) < 80 && Math.abs(LX[b.l] - R.px) < 90) {
						if(R.shield > 0) {
							R.shield--;
							float('🛡', LX[b.l], 900, '#7fe9ff')
						} else R.gap -= R.D.hit * .9;
						R.inv = .8;
						UI.shake = 14;
						float('☄ ОБСТРЕЛ!', LX[b.l], 860, '#ff4d4d')
					}
				}
				if(b.done) b.f -= dt
			});
			R.bs = R.bs.filter(b => !b.done || b.f > 0)
		}
		if(R.fl) R.fl.t -= dt;
		if(!R.half && R.t > R.dur * .5) {
			R.half = 1;
			float('🔥 ПОЛОВИНА ПУТИ!', 360, 820, '#ffb800', 44)
		}
		if(R.d >= 1 && !R.bonus && !R.M.lava) {
			if(R.lw > 0) {
				R.lw -= dt;
				if(R.lw <= 0) {
					if(R.jy < 60 && R.inv <= 0) {
						if(R.shield > 0) {
							R.shield--;
							R.inv = .8;
							UI.shake = 8;
							float('🛡 БЛОК!', 360, 900, '#7fe9ff')
						} else {
							R.gap -= R.D.hit * .8;
							UI.shake = 14;
							SoundManager.play('fail');
							float('💥 ТОЛЧОК!', 360, 900, '#ff4d4d')
						}
					} else float('✔ УВЕРНУЛСЯ!', 360, 900, '#4cd964')
				}
			} else if(R.t > R.lt && R.t < R.dur - 3) {
				R.lw = 1.4;
				R.lt = R.t + rnd(8, 12)
			}
		}
		if(R.spawn <= 0 && R.t < R.dur - 2 && !R.bonus) spawnPattern();
		const sp = (520 + R.t * R.M.acc) * R.D.sp * (R.half ? 1.12 : 1) * (R.slowT > 0 ? R.slowF : 1);
		R.obs.forEach(o => {
			if(isPK(o.type) && !o.dead) {
				const rad = R.mag > 0 ? 700 : [0, 260, 420][lv('magnet')],
					dx = R.px - o.x,
					dy = 1000 - o.y,
					ds = Math.hypot(dx, dy);
				if(rad && (o.pl || ds < rad) && o.y > -50) {
					o.pl = 1;
					const m = Math.max(1000, sp * 1.6) * dt;
					if(ds <= m) {
						o.x = R.px;
						o.y = 1000
					} else {
						o.x += dx / ds * m;
						o.y += dy / ds * m
					}
					return
				}
			}
			o.y += sp * dt * (o.vm || 1);
			o.x = o.type === 4 ? 360 + Math.sin(R.t * 2.2 + o.ph) * 200 : (o.pl ? o.x : LX[o.l])
		});
		R.px += (LX[R.lane] - R.px) * Math.min(1, (R.M.ice ? 5 : 14) * dt);
		R.obs = R.obs.filter(o => o.y < 1350 && !o.dead);
		R.vy -= R.M.g * dt;
		R.jy = Math.max(0, R.jy + R.vy * dt);
		if(R.jy === 0 && R.vy < 0) R.vy = 0;
		for(const o of R.obs)
			if(isPK(o.type) && !o.dead && Math.abs(o.y - 1010) < 70 && Math.abs(o.x - R.px) < 70) {
				o.dead = 1;
				if(o.type === 2) {
					const g = 1 + (Math.random() < .25 * lv('vein') + .1 * prL('gem') ? 1 : 0);
					SV.gems += g;
					R.gems += g;
					SV.stats.gp += g;
					float('+' + g + '💎', LX[o.l], 900, '#7fe9ff');
					if(!R.bonus) burst(LX[o.l], 1000, '#7fe9ff', 8)
				} else if(o.type === 7) {
					const k = o.k;
					if(k === 0) {
						R.shield = Math.min(R.shield + 1, 5);
						float('🛡 ЩИТ', o.x, 900, '#7fe9ff')
					} else if(k === 1) {
						R.slowF = R.slowT > 0 ? Math.min(R.slowF, .6) : .6;
						R.slowT = Math.max(R.slowT, 4);
						float('⏳ ЗАМЕДЛЕНИЕ', o.x, 900, '#ffb800')
					} else {
						R.mag = 6;
						float('🧲 МАГНИТ', o.x, 900, '#7fe9ff')
					}
				} else {
					const v = R.bonus ? 30 : 15;
					SV.coins += v;
					R.coins += v;
					if(!R.bonus || Math.random() < .25) float('+' + v, LX[o.l], 900, '#ffe14d')
				}
				const pc = o.type === 2 ? '#7fe9ff' : o.type === 3 ? '#ffe14d' : ['#7fe9ff', '#ffb800', '#d98cff'][o.k];
				if(o.type !== 3 || !R.bonus) {
					R.fl = {
						c: pc,
						t: .35
					};
					if(UI.rings.length < 10) UI.rings.push({
						x: R.px,
						y: 1000,
						r: 30,
						l: .4,
						col: pc
					});
					burst(R.px, 1000, pc, o.type === 3 ? 4 : 12)
				}
				SoundManager.play('collect')
			}
		for(const o of R.obs)
			if(!isPK(o.type) && !o.dead && (o.type === 6 || (Math.abs(o.x - LX[R.lane]) < 80 && Math.abs(o.x - R.px) < 80)) && Math.abs(o.y - 1010) < Math.max(55, (o.h || 0) / 2 + 25) && (HI.includes(o.type) || (R.jy < 60 && R.leap <= 0)) && R.inv <= 0) {
				o.dead = 1;
				if(R.shield > 0) {
					R.shield--;
					float('🛡', LX[R.lane], 900, '#7fe9ff')
				} else R.gap -= R.D.hit;
				R.inv = .8;
				UI.shake = 14;
				SoundManager.play('fail');
				float('АЙ!', LX[R.lane], 900, '#ff4d4d')
			}
		if(!R.bonus) R.gap = Math.min(1, R.gap + (.025 + .01 * lv('slow') - R.D.drain) * dt);
		if(R.bonus) {
			R.bt -= dt;
			R.bsp -= dt;
			if(R.bsp <= 0) {
				R.bsp = R.bk === 2 ? .45 : .12;
				R.obs.push({
					l: ri(0, 2),
					y: -60,
					type: R.bk
				})
			}
			if(R.bt <= 0) {
				R.bonus = false;
				finishWin()
			}
		} else if(R.gap <= 0) {
			R.over = true;
			R.win = false;
			SV.stats.streak = 0;
			SoundManager.play('fail')
		} else if(R.t >= R.dur) {
			if(Math.random() < .14 + .02 * R.d) {
				SV.stats.ab++;
				R.bonus = true;
				R.bt = 10;
				R.bsp = 0;
				R.bk = Math.random() < .25 ? 2 : 3;
				R.obs = R.obs.filter(o => isPK(o.type));
				SoundManager.play('success');
				UI.shake = 10
			} else finishWin()
		}
	}

	function finishWin() {
		R.over = true;
		R.win = true;
		R.first = !SV.stolen[R.target.id];
		R.reward = Math.round((200 + R.target.value * 30) * R.D.rw * (R.first ? 1 : .6) * pm());
		R.fg = R.first ? ({
			rare: 1,
			epic: 2,
			legendary: 4,
			mythic: 8,
			secret: 15
		}[R.target.rarity] || 0) : 0;
		SV.gems += R.fg;
		SV.stolen[R.target.id] = 1;
		R.gemRw = R.d >= 2 ? R.d - 1 : 0;
		SV.gems += R.gemRw;
		SV.stats.raids++;
		SV.stats.streak++;
		SV.stats.bestStreak = Math.max(SV.stats.bestStreak, SV.stats.streak);
		if(R.gap > .6 && R.d >= 1) SV.stats.fastRaid = 1;
		if(R.d === 3) SV.stats.hell++;
		if(R.mi * 4 + R.d === SV.rp && SV.rp < 15) {
			SV.rp++;
			UI.toast('🔓 Открыт новый уровень!')
		}
		give(R.target);
		SV.best = Math.max(SV.best, R.reward);
		Leaderboard.submitScore(SV.best);
		SoundManager.play('success');
		burst(360, 500, '#ffe14d', 30)
	}

	function raidDraw() {
		bg(R.M.a, R.M.b);
		ctx.fillStyle = '#ffffff14';
		for(let i = 0; i < 3; i++) {
			rr(LX[i] - 90, 0, 180, H, 0);
			ctx.fill()
		}
		if(R.slowT > 0) {
			ctx.fillStyle = '#4aa8ff26';
			ctx.fillRect(0, 0, W, H)
		}
		const bt = 1280 - (1 - R.gap) * 0 + 0;
		T('ЦЕЛЬ: ' + nmL(R.target).toUpperCase(), 360, 60, 34, RAR[R.target.rarity].col);
		bar(60, 100, 600, 30, R.t / R.dur, '#3d9bff');
		T('БОСС', 60, 160, 24, '#ff7a7a', 'left'); {
			let cy = 200;
			[
				[R.shield > 0, '🛡 ×' + R.shield, '#7fe9ff'],
				[R.slowT > 0, '⏳ ' + R.slowT.toFixed(1) + 'с', '#ffb800'],
				[R.mag > 0, '🧲 ' + R.mag.toFixed(1) + 'с', '#d98cff'],
				[R.inv > 1, '✨ ' + R.inv.toFixed(1) + 'с', '#fff']
			].forEach(c => {
				if(c[0]) {
					T(c[1], 700, cy, 28, c[2], 'right');
					cy += 36
				}
			})
		}
		if(R.gems) T('💎 +' + R.gems, 20, 200, 30, '#7fe9ff', 'left');
		if(R.coins) T('🪙 +' + R.coins, 20, 236, 26, '#ffe14d', 'left');
		if(R.lw > 0) {
			const f = R.lw / 1.4,
				gc = f < .3 ? '#4cd964' : '#ff3d3d';
			ctx.strokeStyle = gc;
			ctx.lineWidth = 8;
			ctx.beginPath();
			ctx.arc(R.px, 1000, 60 + 130 * f, 0, 7);
			ctx.stroke();
			T(f < .3 ? 'ПРЫГАЙ СЕЙЧАС!' : '⚠ ПРЫГАЙ!', 360, 470, 56, gc);
			T(R.lw.toFixed(1), 360, 545, 76, '#fff')
		}
		if(R.bonus) {
			T('ADMIN ABUSE', 360, 270, 64, Math.floor(R.t * 8) % 2 ? '#ff3d3d' : '#ffe14d');
			T(Math.max(0, R.bt).toFixed(1) + 'с  ' + (R.bk === 2 ? '💎' : '🪙'), 360, 340, 52)
		}
		bar(140, 146, 520, 26, R.gap, R.gap < .35 ? '#ff3d3d' : '#ff9d2e');
		if(R.t > R.dur - 4) {
			const py = (R.t - (R.dur - 4)) / 4 * 900 - 100;
			ctx.fillStyle = '#00f0d0';
			rr(200, py, 320, 40, 20);
			ctx.fill();
			T('ПОРТАЛ', 360, py + 20, 28, '#003')
		}
		R.obs.forEach(o => {
			const t = o.type,
				x = o.x || LX[o.l];
			if(isPK(t)) {
				const gc = t === 2 ? '#7fe9ff' : t === 3 ? '#ffe14d' : ['#7fe9ff', '#ffb800', '#d98cff'][o.k];
				ctx.fillStyle = gc + '44';
				ctx.beginPath();
				ctx.arc(x, o.y, (t === 3 ? 34 : 48) + Math.sin(R.t * 8 + o.ph) * 5, 0, 7);
				ctx.fill();
				T(t === 2 ? '💎' : t === 3 ? '🪙' : ['🛡', '⏳', '🧲'][o.k], x, o.y, t === 3 ? 52 : 64);
				if(t === 7) T(['ЩИТ', 'ЗАМЕДЛ.', 'МАГНИТ'][o.k], x, o.y + 54, 18, gc);
				return
			}
			if(t === 5) {
				ctx.fillStyle = 'rgba(255,60,60,' + (.1 + .1 * Math.sin(R.t * 25)) + ')';
				ctx.fillRect(x - 60, 0, 120, H);
				if(o.y < 120) T('❗', x, 190, 90);
				ctx.fillStyle = '#ff6a00aa';
				rr(x - 14, o.y - 130, 28, 130, 12);
				ctx.fill();
				T('🚀', x, o.y, 100);
				return
			}
			if(t === 9) {
				ctx.fillStyle = 'rgba(120,200,255,' + (.1 + .1 * Math.sin(R.t * 25)) + ')';
				ctx.fillRect(x - 60, 0, 120, H);

	function play(dt) {
		bg();
		topBar();
		const hasRaid = SV.stats.merges >= 1;
		if(comboT > 0) {
			comboT -= dt;
			if(comboT <= 0) combo = 0
		}
		if(combo > 1) T('КОМБО x' + combo, 560, 45, 34, '#ff9d2e');
		spawnT -= dt;
		if(G.an) {
			G.an.t -= dt;
			if(G.an.t <= 0 || !slots.includes(G.an.s)) G.an = null
		} else {
			G.at = (G.at === undefined ? rnd(5, 9) : G.at) - dt;
			if(G.at <= 0 && slots.length) {
				const t = rnd(4, 9);
				G.an = {
					s: slots[ri(0, slots.length - 1)],
					t,
					max: t
				};
				G.at = rnd(8, 15)
			}
		}
		const am = prL('auto');
		if(am) {
			G.am = (G.am || 0) + dt;
			if(G.am >= 12 - 2 * am) {
				G.am = 0;
				autoMerge()
			}
		}
		G.acc = (G.acc || 0) + dt;
		if(G.acc >= 1) {
			G.acc -= 1;
			SV.coins += Math.round(fabR() * (SV.boostT > 0 ? 2 : 1) * pm())
		}
		if(lv('fab')) T('🏭 +' + Math.round(fabR()) + '/с', 600, 100, 24, '#ffe14d');
		if(spawnT <= 0) {
			spawnT = G.fast ? .4 : SPN[lv('spawn')];
			spawn()
		}
		hint = !SV.stats.taps ? 'ЖМИ НА БРЕЙНРОТА!' : !SV.stats.merges ? 'ПЕРЕТАЩИ ОДИНАКОВЫХ ДРУГ НА ДРУГА!' : hasRaid && !SV.stats.raids ? 'ОТКРЫТЫ РЕЖИМЫ! ПОПРОБУЙ RUSH!' : '';
		SP.forEach((p, i) => {
			ctx.fillStyle = i < maxS() ? '#ffffff14' : '#00000040';
			rr(p[0] - 80, p[1] - 80, 160, 160, 26);
			ctx.fill();
			if(i >= maxS()) T('🔒', p[0], p[1], 36, '#fff6')
		});
		if(SV.boostT > 0) T('⚡ x2 ' + fmt(SV.boostT), 360, 100, 24, '#ffe14d');
		if(stN()) T('🦹 Кражи: ' + stN() + ' (+' + stN() * 10 + '% к тапу)', 20, 100, 22, '#ffb800', 'left');
		slots.forEach((s, i) => {
			const p = SP[s.p];
			s.sq *= .88;
			UI.btns.push({
				x: p[0] - 85,
				y: p[1] - 85,
				w: 170,
				h: 170,
				drag: s
			});
			if(G.drag && G.drag.moved && s !== G.drag.s && s.c === G.drag.s.c && Math.hypot(G.drag.x - p[0], G.drag.y - p[1]) < 90) {
				ctx.fillStyle = '#4cd96499';
				rr(p[0] - 88, p[1] - 88, 176, 176, 28);
				ctx.fill()
			}
			if(G.an && G.an.s === s) {
				const f = 4 + (1 - G.an.t / G.an.max) * 16,
					pu = .5 + .5 * Math.sin(performance.now() / 1000 * f);
				ctx.globalAlpha = .25 + .4 * pu;
				ctx.fillStyle = '#ffe14d';
				rr(p[0] - 90, p[1] - 90, 180, 180, 30);
				ctx.fill();
				ctx.globalAlpha = 1;
				ctx.strokeStyle = '#ffe14d';
				ctx.lineWidth = 5;
				ctx.stroke();
				T('⚡' + Math.ceil(G.an.t), p[0] + 55, p[1] - 62, 24, '#ffe14d')
			}
			if(!(G.drag && G.drag.s === s)) drawChar(s.c, p[0], p[1] + Math.sin(performance.now() / 350 + s.bob) * 6, 140, s.sq);
			T(lvT(s.c), p[0], p[1] + 86, 15, RAR[s.c.rarity].col);
			if(s.c.lvl) {
				ctx.fillStyle = RAR[s.c.rarity].col;
				ctx.beginPath();
				ctx.arc(p[0] - 62, p[1] - 62, 21, 0, 7);
				ctx.fill();
				ctx.strokeStyle = '#fff';
				ctx.lineWidth = 3;
				ctx.stroke();
				T(s.c.lvl, p[0] - 62, p[1] - 61, 26, '#fff')
			}
		});
		if(G.drag && G.drag.moved && slots.includes(G.drag.s)) drawChar(G.drag.s.c, G.drag.x, G.drag.y, 160, .06);
		if(hint) T(hint, 360, 262, 26, '#fff');
		if(lv('bin')) {
			const ov = G.drag && G.drag.moved && G.drag.x >= 520 && G.drag.y >= 1165;
			ctx.fillStyle = ov ? '#ff3d3dcc' : '#00000088';

			ctx.strokeStyle = '#fff8';
			ctx.lineWidth = 3;
			ctx.stroke();

			T(ov && slots.includes(G.drag.s) ? '+' + sellP(G.drag.s.c) : 'ПРОДАТЬ', 645, 1213, ov ? 26 : 20)
		}
		if(hasRaid) B(130, 990, 460, 110, '🎮 РЕЖИМЫ', '#ff3d3d', () => go('modes'), 46);
		if(merged && mergeT > 0) {
			mergeT -= dt;
			const e = Math.min(1, (2.6 - mergeT) * 5, mergeT * 4),
				y = 190 - (1 - e) * 70;

			T(nmL(merged.n), 470, y + 51, 20, RAR[merged.n.rarity].col);
			ctx.globalAlpha = 1
		}
		back()
	}

	function buy(u) {
		const l = lv(u.id);
		if(l >= u.costs.length) return;
		if(u.req && !u.req(l)) {
			UI.toast('🔒 Сначала укради: ' + CH[FMIN[l]].name);
			SoundManager.play('fail');
			return
		}
		const c = u.costs[l],
			cu = ucur(u);
		if(SV[cu] < c) {
			UI.toast('Не хватает ' + (cu === 'gems' ? '💎' : '💰'));
			SoundManager.play('fail');
			return
		}
		SV[cu] -= c;
		SV.up[u.id] = l + 1;
		SV.stats.ups++;
		SoundManager.play('merge');
		UI.toast('Куплено: ' + u.n + ' ' + (l + 1) + '/' + u.costs.length);
		SaveManager.save()
	}

	function abCost(c, l) {
		const m = RAR[c.rarity].m;
		return m <= 4 ? {
			cur: 'coins',
			v: Math.round(100 * (m + 1) * Math.pow(1.8, l))
		} : {
			cur: 'gems',
			v: Math.round({
				epic: 5,
				legendary: 8,
				mythic: 12,
				secret: 18
			}[c.rarity] * Math.pow(1.7, l))
		}
	}

	function abDesc(a, l) {
		const e = a[3],
			k = 1 + .2 * l,
			p = [];
		if(e.inv) p.push('неуязв. ' + (e.inv * k).toFixed(1) + 'с');
		if(e.back) p.push('босс назад ' + Math.round(e.back * k * 100) + '%');
		if(e.clr) p.push(e.clr >= 1300 ? 'сносит все преграды' : 'сносит ближние');
		if(e.slow) p.push('замедл. ' + Math.round(e.t * k) + 'с');
		if(e.leap) p.push('авто-прыжок ' + Math.round(e.leap * k) + 'с');
		if(e.mag) p.push('магнит ' + Math.round(e.mag * k) + 'с');
		if(e.coin) p.push('+' + Math.round(e.coin * k) + ' монет');
		return p.join(', ') + ' · откат ' + Math.round(a[2] * (1 - .05 * l)) + 'с'
	}

	function buyAb(c) {

	function addPipe(x, prev) {

			};
		F.pipes.push(p);
		if(Math.random() < .55) F.it.push({
			p, off: 0, k: 'c'
		});
		if(Math.random() < .28) F.it.push({
			p, off: (Math.random() < .5 ? -1 : 1) * (g / 2 - 42), k: Math.random() < .5 ? 's' : 'm'

	// ---- BRAINROT JUMP

		});

			c.width = c.height = Math.ceil(s * 1.4);
			const g = c.getContext('2d');
			g.font = s + 'px system-ui,Apple Color Emoji,Segoe UI Emoji';
			g.textAlign = 'center';
			g.textBaseline = 'middle';
			g.fillText(ch, c.width / 2, c.height / 2);
			_es[ch + s] = c
		}
		ctx.drawImage(c, x - c.width / 2, y - c.height / 2)
	}

	function exitDlg() {
		ctx.fillStyle = '#000b';
		ctx.fillRect(0, 0, W, H);
		ctx.fillStyle = '#2a1650';
		rr(80, 430, 560, 380, 36);
		ctx.fill();
		ctx.strokeStyle = '#fff';
		ctx.lineWidth = 4;
		ctx.stroke();
		T('⚠ ВЫЙТИ?', 360, 500, 48, '#ffb800');
		T('Награда за этот заход', 360, 570, 28);
		T('будет аннулирована!', 360, 610, 28, '#ff7a7a');
		B(110, 660, 230, 90, 'ОСТАТЬСЯ', '#4cd964', () => {
			G.xc = 0
		}, 30);
		B(380, 660, 230, 90, 'ВЫЙТИ', '#ff3d3d', () => {
			G.xc = 0;
			go('modes')
		}, 30)
	}
	const DBG = {
		s: 0,
		e: 0,
		w: 0
	};

	function dbgTap(k) {
		if(k === 's') {
			DBG.s++;
			DBG.e = 0;
			DBG.w = 0
		} else if(DBG.s === 6) {
			DBG.e++;
			if(!DBG.w) {
				DBG.w = 1;
				setTimeout(() => {
					if(DBG.s === 6 && DBG.e === 4 && scene === 'settings') go('dbg');
					DBG.s = 0;
					DBG.e = 0;
					DBG.w = 0
				}, 1000)
			}
		} else {
			DBG.s = 0;
			DBG.e = 0
		}
	}

	function dbgScr() {
		bg();
		topBar();
		T('🛠 ДЕБАГ', 360, 108, 44);
		const A = [
			['+10 000 💰', () => SV.coins += 1e4],
			['+1 000 000 💰', () => SV.coins += 1e6],
			['+100 💎', () => SV.gems += 100],
			['+10 🧠 (перерожд.)', () => {
				SV.pr.pts += 10
			}],
			['Открыть все уровни', () => SV.rp = 15],
			['Украсть всех + открыть', () => CH.forEach(c => {
				SV.owned[c.id] = 1;
				if(c.mergeLevel >= 7) SV.stolen[c.id] = 1
			})],
			['Макс. слоты (12)', () => SV.up.slots = 6],
			['Буст ×2 на 1 час', () => SV.boostT = 3600],
			['Бессмертие в Rush: ' + (G.god ? 'ВКЛ' : 'ВЫКЛ'), () => G.god = !G.god],
			['Быстрый спавн: ' + (G.fast ? 'ВКЛ' : 'ВЫКЛ'), () => G.fast = !G.fast]
		];
		A.forEach((a, i) => B(20 + (i % 2) * 350, 150 + Math.floor(i / 2) * 100, 330, 86, a[0], '#3d9bff', () => {
			a[1]();
			UI.toast('✔ ' + a[0]);
			SaveManager.save()
		}, a[0].length > 18 ? 20 : 24));
		back()
	}

	function settings() {
		bg();
		T('⚙ НАСТРОЙКИ', 360, 140, 56);
		B(130, 300, 460, 100, '🔊 Звук  ' + (SV.set.sound ? 'ВКЛ' : 'ВЫКЛ'), '#3d9bff', () => {
			SV.set.sound = !SV.set.sound;
			dbgTap('s')
		}, 38);
		B(130, 430, 460, 100, '✨ Эффекты  ' + (SV.set.fx ? 'ВКЛ' : 'ВЫКЛ'), '#3d9bff', () => {
			SV.set.fx = !SV.set.fx;
			dbgTap('e')
		}, 38);
		B(130, 620, 460, 100, G.rs ? 'НАЖМИ ЕЩЁ РАЗ' : 'СБРОС ПРОГРЕССА', '#ff3d3d', () => {
			if(G.rs) {
				slots = [];
				SaveManager.reset();
				G.rs = 0;
				go('menu')
			} else G.rs = 1
		}, 34);
		back()
	}
	/* ===== LOOP & INPUT ===== */
	let last = performance.now(),
		px0 = null;

	function slotAt(x, y, ex) {
		return slots.find(s => s !== ex && Math.hypot(x - SP[s.p][0], y - SP[s.p][1]) < 90)
	}

	function endDrag(e) {
		const d = G.drag;
		G.drag = null;
		if(scene !== 'play' || !slots.includes(d.s)) return;
		if(!d.moved) {
			tapSlot(slots.indexOf(d.s));
			return
		}
		const [x, y] = pos(e), t = slotAt(x, y, d.s);
		if(lv('bin') && x >= 520 && y >= 1165) {
			const pr = sellP(d.s.c);
			SV.coins += pr;
			slots = slots.filter(q => q !== d.s);
			float('+' + pr + ' 💰', x - 60, y - 60, '#ffe14d', 40);
			burst(x, y, '#ffe14d', 10);
			SoundManager.play('collect');
			return
		}
		if(!t) {
			const fi = SP.findIndex((q, i) => i < maxS() && !slots.some(z => z.p === i) && Math.hypot(x - q[0], y - q[1]) < 100);
			if(fi >= 0) {
				d.s.p = fi;
				SoundManager.play('click');
				return
			}
		}
		if(t && t.c === d.s.c && t.c.mergeLevel < 19) {
			const nn = CH[t.c.mergeLevel + 1];
			if(nn.mergeLevel <= 6 || SV.stolen[nn.id]) doMerge(slots.indexOf(d.s), slots.indexOf(t));
			else {
				float('🔒 Укради: ' + nn.name, SP[t.p][0], SP[t.p][1] - 100, '#ff7a7a', 28);
				SoundManager.play('fail')
			}
		} else if(t) {
			float('Нужны одинаковые!', SP[t.p][0], SP[t.p][1] - 100, '#ff7a7a', 30);
			SoundManager.play('fail')
		}
	}

	function popup(dt) {
		if(!UI.cur && UI.pop.length) {
			UI.cur = UI.pop.shift();
			UI.curT = 0;
			burst(360, 130, '#ffe14d', 14)
		}
		if(!UI.cur) return;
		const t = UI.curT += dt,
			a = UI.cur;
		if(t > 3.2) {
			UI.cur = null;
			return
		}
		const p = Math.min(1, t / .35),
			q = t > 2.8 ? (t - 2.8) / .4 : 0,
			y = 84 - (1 - p) * (1 - p) * 160 - q * 160,
			g = ctx.createLinearGradient(60, y, 660, y);
		g.addColorStop(0, '#ffb800');
		g.addColorStop(1, '#ff7a1a');
		ctx.fillStyle = '#0006';
		rr(64, y + 6, 600, 92, 26);
		ctx.fill();
		ctx.fillStyle = g;
		rr(60, y, 600, 92, 26);
		ctx.fill();
		ctx.strokeStyle = '#fff';
		ctx.lineWidth = 4;
		ctx.stroke();
		T('🏆', 112, y + 46, 52);
		T('ДОСТИЖЕНИЕ!', 390, y + 22, 20, '#fff');
		T(a.n, 390, y + 50, 30, '#fff');
		T('Награда: ' + rwT(a), 390, y + 77, 20, '#fff')
	}
	let achPage = 0;

	function achScr() {
		bg();
		topBar();
		T('🏆 ДОСТИЖЕНИЯ', 360, 108, 40);
		T(ACH.filter(a => SV.ach[a.id]).length + '/' + ACH.length, 560, 45, 28, '#ffe14d');
		ACH.slice(achPage * 8, achPage * 8 + 8).forEach((a, k) => {
			const y = 130 + k * 114,
				d = SV.ach[a.id],
				c = Math.min(a.cur(), a.g);
			ctx.fillStyle = '#0008';
			rr(20, y, 680, 106, 20);
			ctx.fill();
			T(a.n, 40, y + 26, 26, d ? '#ffe14d' : '#fff', 'left');
			T(a.d, 40, y + 56, 19, '#ccc', 'left');
			bar(40, y + 76, 330, 18, c / a.g, d ? '#ffb800' : '#4cd964');
			T(c + '/' + a.g, 385, y + 85, 18, '#fff', 'left');
			if(d === 2) B(500, y + 17, 180, 72, '✓ ПОЛУЧЕНО', '#444', () => {}, 22);
			else if(d === 1) B(500, y + 17, 180, 72, '🎁 ' + rwT(a), '#4cd964', () => claimAch(a), 28);
			else B(500, y + 17, 180, 72, '🔒 ' + rwT(a), '#4a3a6a', () => {}, 26)
		});
		const pg = Math.ceil(ACH.length / 8);
		B(130, 1055, 150, 70, '◀', '#3d9bff', () => achPage = Math.max(0, achPage - 1), 36);
		T((achPage + 1) + ' / ' + pg, 360, 1090, 30);
		B(440, 1055, 150, 70, '▶', '#3d9bff', () => achPage = Math.min(pg - 1, achPage + 1), 36);
		back()
	}

	function frame(now) {
		const dt = Math.max(0, Math.min(.05, (now - last) / 1000));
		if(SV.boostT > 0) SV.boostT = Math.max(0, SV.boostT - dt);
		last = now;
		UI.btns = [];
		ctx.setTransform(K, 0, 0, K, 0, 0);
		ctx.save();
		if(UI.shake > .3) {
			ctx.translate(rnd(-UI.shake, UI.shake), rnd(-UI.shake, UI.shake));
			UI.shake *= .85
		}
		if(scene === 'raid') {
			const n = Math.max(1, Math.ceil(dt / .017));
			for(let i = 0; i < n; i++) raidUpdate(dt / n);
			raidDraw()
		} else({
			menu, play: () => play(dt), collection, records, shop, settings, dbg: dbgScr, bros: brosScr, reb: rebScr, ach: achScr, modes: modesScr, flappy: () => flScr(dt), jumpm: () => jpScr(dt)
		})[scene]();
		UI.floats.forEach(f => {
			f.y -= 90 * dt;
			f.l -= dt * 1.1;
			ctx.globalAlpha = Math.max(0, f.l);
			T(f.t, f.x, f.y, f.s, f.col)
		});
		ctx.globalAlpha = 1;
		UI.floats = UI.floats.filter(f => f.l > 0);
		UI.parts.forEach(p => {
			p.x += p.vx * dt;
			p.y += p.vy * dt;
			p.vy += 900 * dt;
			p.l -= dt;
			ctx.globalAlpha = Math.max(0, p.l);
			ctx.fillStyle = p.col;
			ctx.fillRect(p.x, p.y, 10, 10)
		});
		ctx.globalAlpha = 1;
		UI.parts = UI.parts.filter(p => p.l > 0);
		UI.rings.forEach(r => {
			r.r += 260 * dt;
			r.l -= dt;
			ctx.globalAlpha = Math.max(0, r.l * 2);
			ctx.strokeStyle = r.col;
			ctx.lineWidth = 8;
			ctx.beginPath();
			ctx.arc(r.x, r.y, r.r, 0, 7);
			ctx.stroke()
		});
		ctx.globalAlpha = 1;
		UI.rings = UI.rings.filter(r => r.l > 0);
		if(UI.msgT > 0) {
			UI.msgT -= dt;
			ctx.fillStyle = '#000c';
			rr(60, 1085, 600, 70, 30);
			ctx.fill();
			T(UI.msg, 360, 1120, 30, '#ffe14d')
		}
		ctx.restore();
		popup(dt);
		G.ct = (G.ct || 0) + dt;
		if(G.ct > .5) {
			G.ct = 0;
			checkAch()
		}
		requestAnimationFrame(frame)
	}

	function modePointer(x, y) {
		if(scene !== 'flappy' && scene !== 'jumpm') return;
		if(UI.btns.some(b => x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h)) return;
		if(scene === 'flappy') {
			if(!G.xc) flap()
		} else J.tx = x
	}

	function pos(e) {
		const r = cv.getBoundingClientRect();
		return [(e.clientX - r.left) * W / r.width, (e.clientY - r.top) * H / r.height]
	}
	cv.addEventListener('pointerdown', e => {
		const [x, y] = pos(e);
		modePointer(x, y);
		px0 = [x, y];
		for(let i = UI.btns.length - 1; i >= 0; i--) {
			const b = UI.btns[i];
			if(x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) {
				px0 = null;
				if(b.drag) {
					G.drag = {
						s: b.drag,
						x0: x,
						y0: y,
						x,
						y,
						moved: false
					};
					cv.setPointerCapture && cv.setPointerCapture(e.pointerId)
				} else b.fn();
				return
			}
		}
	});
	cv.addEventListener('pointermove', e => {
		if(scene === 'jumpm') J.tx = pos(e)[0];
		const d = G.drag;
		if(!d) return;
		const [x, y] = pos(e);
		d.x = x;
		d.y = y;
		if(Math.hypot(x - d.x0, y - d.y0) > 18) d.moved = true
	});
	cv.addEventListener('pointercancel', () => {
		G.drag = null
	});
	cv.addEventListener('pointerup', e => {
		if(G.drag) {
			endDrag(e);
			return
		}
		if(!px0 || scene !== 'raid' || R.over) return;
		const [x, y] = pos(e), dx = x - px0[0], dy = y - px0[1];
		if(Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)) lane(dx > 0 ? 1 : -1);
		else if(dy < -40) jump();
		px0 = null
	});
	addEventListener('keyup', e => {
		const k = e.key;
		if(k === 'a' || k === 'ArrowLeft') J.kl = 0;
		if(k === 'd' || k === 'ArrowRight') J.kr = 0
	});
	addEventListener('keydown', e => {
		const k = e.key;
		if(scene === 'flappy' && (k === ' ' || k === 'ArrowUp' || k === 'w')) {
			flap();
			e.preventDefault();
			return
		}
		if(scene === 'jumpm') {
			if(k === 'a' || k === 'ArrowLeft') J.kl = 1;
			if(k === 'd' || k === 'ArrowRight') J.kr = 1;
			return
		}
		if(scene !== 'raid' || R.over) return;
		if(k === 'e' || k === 'E' || k === 'Shift') {
			useAb();
			return
		}
		if(k === 'a' || k === 'A' || k === 'ArrowLeft') lane(-1);
		else if(k === 'd' || k === 'D' || k === 'ArrowRight') lane(1);
		else if(k === ' ' || k === 'ArrowUp' || k === 'w') {
			jump();
			e.preventDefault()
		}
	});
	document.addEventListener('visibilitychange', () => {
		last = performance.now();
		SaveManager.save()
	});
	slots = (SV.slots || []).map(o => ({
		p: o.p,
		c: CH.find(c => c.id === o.id),
		sq: 0,
		bob: rnd(0, 6)
	})).filter((s, i, a) => s.c && s.p >= 0 && s.p < maxS() && a.findIndex(z => z.p === s.p) === i);
	requestAnimationFrame(frame);
	</script>
</body>

</html>
